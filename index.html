<!doctype html><html lang="vi"><head><title>Phieu giao hang</title>
<style>@page{size:210mm 297mm;margin:5mm}*{box-sizing:border-box}html,body{margin:0;padding:0;background:#fff;color:#1f2937;font-family:Inter,Arial,sans-serif}.wrap{width:199mm;max-width:100%;margin:0 auto;padding:3mm;font-size:13px;line-height:1.3}header{display:flex;flex-wrap:wrap;align-items:flex-start;gap:4px 8px;border-bottom:1px solid #3C2415;padding-bottom:6px;margin-bottom:8px}.brand{display:flex;gap:4px;width:100%}.logo{width:40px;height:40px;flex:0 0 40px;display:flex;align-items:center;justify-content:center;font-size:10px;color:#999}.cinfo{flex:1;text-align:center}.cname{font-size:15px;font-weight:bold;line-height:1.15}.cmeta{font-size:10px;line-height:1.25}h1{font-size:18px;width:100%;text-align:center;margin:4px 0 0;color:#3C2415;line-height:1.15}.meta{display:grid;grid-template-columns:1fr 1fr;gap:3px 12px;padding:6px 0}.meta div{line-height:1.25}.customer{margin:5px 0;padding:7px;background:#fffaf0;border:1px solid #e7dcc0;border-radius:4px}.customer h2{font-size:13px;margin:0 0 4px;color:#3c2415}table{width:100%;border-collapse:collapse;margin-top:6px;font-size:11px}th,td{border:1px solid #d1d5db;padding:5px;vertical-align:top}th{background:#f5efe3;text-align:left}.num{text-align:right;white-space:nowrap}.total{text-align:right;font-weight:bold;margin-top:7px;font-size:13px}.sign{display:grid;grid-template-columns:1fr 1fr;margin-top:8px;font-weight:bold}.sign div:last-child{text-align:right}.btn{display:block;margin:18px auto;padding:10px 22px;border-radius:999px;background:#3C2415;color:#fff;font-weight:700;border:none;font-size:14px}@media print{body{-webkit-print-color-adjust:exact;print-color-adjust:exact}.btn{display:none}}</style>
</head><body><div id="root" style="text-align:center;padding:40px;color:#666">Dang tai phieu...</div>
<script>
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function fmt(n){n=Number(n)||0;return (Math.round(n*100)/100).toString();}
function calcKg(p){var m=String(p.quyCach||"").match(/([0-9]+(?:\.[0-9]+)?)/);var u=m?Number(m[1]):0;return u>0?(Number(p.soGoi)||0)*u:(Number(p.soKg)||0);}
try{
  var b64=new URLSearchParams(location.search).get("d")||"";
  if(!b64) throw new Error("no data");
  var s=b64.replace(/-/g,"+").replace(/_/g,"/"); while(s.length%4) s+="=";
  var json=decodeURIComponent(escape(atob(s)));
  var o=JSON.parse(json);
  if(Array.isArray(o)){ o={soPhieu:o[1]||"",soPhieuXuat:o[2]||"",soPO:o[3]||"",ngayGiao:o[4]||"",kh:{ma:(o[5]||[])[0]||"",ten:(o[5]||[])[1]||"",dc:(o[5]||[])[2]||"",nn:(o[5]||[])[3]||"",sdt:(o[5]||[])[4]||"",xe:(o[5]||[])[5]||""},ct:{ten:(o[6]||[])[0]||"",sdt:(o[6]||[])[1]||"",mail:(o[6]||[])[2]||"",dc:(o[6]||[])[3]||""},sp:o[7]||[],tong:o[8]||0}; }
  var t=o; var kh=t.kh||{}; var ct=t.ct||{}; var sp=t.sp||[];
  var meta=[ct.sdt||"",ct.mail||"",ct.dc||""].filter(Boolean).join(" · ");
  var khHtml=[kh.ten?'<div><b>• '+esc(kh.ten)+'</b></div>':"",kh.ma?'<div>'+esc(kh.ma)+'</div>':"",kh.dc?'<div>'+esc(kh.dc)+'</div>':"",kh.nn?'<div><b>• '+esc(kh.nn)+'</b></div>':"<div>-</div>",kh.sdt?'<div>'+esc(kh.sdt)+'</div>':"",kh.xe?'<div>'+esc(kh.xe)+'</div>':""].join("");
  var rows="", tongKg=0, tongSL=0;
  sp.forEach(function(r,i){var p={maKho:r[0]||"",maFast:r[1]||"",tenSP:r[2]||"",quyCach:r[3]||"",ngaySX:r[4]||"",soGoi:r[5]||0,donVi:r[6]||"",soKg:r[7]||0}; var kg=calcKg(p); tongKg+=kg; tongSL+=Number(p.soGoi)||0;
    rows+='<tr><td>'+(i+1)+'</td><td>'+esc(p.maFast)+'</td><td>'+(p.maKho?'<strong>'+esc(p.maKho)+'</strong><br>':"")+esc(p.tenSP)+'</td><td>'+esc(p.quyCach||"-")+'</td><td>'+esc(p.ngaySX||"-")+'</td><td>'+fmt(p.soGoi)+' '+esc(p.donVi)+'</td><td class="num">'+fmt(kg)+' kg</td></tr>';});
  if(!rows) rows='<tr><td colspan="7">Khong co san pham</td></tr>';
  if(t.tong) tongKg=Number(t.tong)||tongKg;
  document.getElementById("root").innerHTML='<div class="wrap"><header><div class="brand"><div class="logo">LOGO</div><div class="cinfo"><div class="cname">'+esc(ct.ten||"RUNAM")+'</div>'+(meta?'<div class="cmeta">'+esc(meta)+'</div>':"")+'</div></div><h1>PHIEU GIAO HANG</h1></header><div class="meta"><div><b>So phieu:</b> '+esc(t.soPhieu||"-")+'</div><div><b>So phieu xuat:</b> '+esc(t.soPhieuXuat||"-")+'</div><div><b>So PO:</b> '+esc(t.soPO||"-")+'</div><div><b>Ngay giao:</b> '+esc(t.ngayGiao||"-")+'</div></div><section class="customer"><h2>THONG TIN KHACH HANG</h2>'+khHtml+'</section><table><thead><tr><th>STT</th><th>Ma Fast</th><th>San pham</th><th>Quy cach</th><th>NSX</th><th>So luong</th><th>Kg</th></tr></thead><tbody>'+rows+'</tbody></table><div class="total"><div>Tong so luong: '+fmt(tongSL)+'</div><div>Tong khoi luong: '+fmt(tongKg)+' kg</div><div>Gross Weight ______________kg</div></div><div class="sign"><div>Nguoi giao hang</div><div>Nguoi nhan hang</div></div><button class="btn" onclick="window.print()">In phieu</button></div>';
}catch(e){document.getElementById("root").innerHTML='<div style="text-align:center;padding:40px;color:#991b1b">Khong doc duoc ma QR. Hay quet lai phieu goc.</div>';}
</script></body></html>
