<!doctype html><html lang="vi"><head><meta charset="utf-8"><title>Phiếu giao hàng</title>
<style>@page{size:210mm 297mm;margin:5mm}*{box-sizing:border-box}html,body{margin:0;padding:0;background:#fff;color:#1f2937;font-family:Inter,Arial,sans-serif}.wrap{width:700px;max-width:100%;margin:0 auto;padding:16px;font-size:13px;line-height:1.4}h1{font-size:18px;text-align:center;margin:0 0 12px;color:#3C2415;border-bottom:1px solid #3C2415;padding-bottom:10px;letter-spacing:.02em}.cols{display:flex;gap:12px;margin-bottom:12px}.box{border:1px solid #e5e7eb;border-radius:8px;padding:12px;background:#fff}.box.left{width:35%}.box.right{width:65%}.box h2{font-size:11px;margin:0 0 8px;color:#1f2937;letter-spacing:.05em;border-bottom:1px solid #3C2415;padding-bottom:6px}.row{display:flex;justify-content:space-between;gap:8px;padding-bottom:4px;border-bottom:1px solid rgba(243,232,208,.6);margin-bottom:4px;font-size:12px}.row b{font-weight:700}.row span{text-align:right}.cust{font-size:12px;text-align:left}.cust .name{font-size:13px;font-weight:700;color:#3C2415}.cust .recv{font-weight:700}.cust div{margin-bottom:2px}table{width:100%;border-collapse:collapse;margin-top:6px;font-size:12px}th,td{border:1px solid #d1d5db;padding:8px;vertical-align:top;text-align:left}th{background:#3C2415;color:#fff;font-weight:700;font-size:11px}.num{text-align:right;white-space:nowrap}.total{text-align:right;font-weight:700;margin-top:10px;font-size:13px;border-top:2px solid #3C2415;padding-top:8px}.total div{margin-bottom:2px}@media(max-width:560px){.cols{flex-direction:column}.box.left,.box.right{width:100%}}</style>
</head><body><div id="root" style="text-align:center;padding:40px;color:#666">Vui lòng quét mã QR để xem phiếu</div>
<script>
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function fmt(n){n=Number(n)||0;return (Math.round(n*100)/100).toString();}
function fmtDMY(v){var s=String(v||"").trim();var m=s.match(/^(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})/);if(m) return String(m[3]).padStart(2,"0")+"/"+String(m[2]).padStart(2,"0")+"/"+m[1];return s;}
function calcKg(p){var q=String(p.quyCach||"").toLowerCase();var m=q.match(/([0-9]+(?:\.[0-9]+)?)/);var u=m?Number(m[1]):0;if(!u) return Number(p.soKg)||0;if(q.indexOf("kg")>=0) return (Number(p.soGoi)||0)*u;if(q.indexOf("gr")>=0||q.indexOf("g")>=0) return (Number(p.soGoi)||0)*u/1000;return (Number(p.soGoi)||0)*u;}
function unitOf(p){var u=String(p.donVi||"").trim();if(u) return u;var qc=String(p.quyCach||"");return /[0-9]/.test(qc)?"gói":"đơn vị";}
function parseT(){
  var qs=new URLSearchParams(location.search);
  var tt=qs.get("t");
  if(tt){
    var parts=tt.split("|");
    var prods=[];
    if(parts[10]){ prods=parts[10].split(",").filter(Boolean).map(function(x){var f=x.split("::"); return [f[0]||"",f[1]||"",f[2]||"",f[3]||"",f[4]||"",Number(f[5])||0,f[6]||"",0];}); }
    return {soPhieu:parts[0]||"",soPhieuXuat:parts[1]||"",soPO:parts[2]||"",ngayGiao:parts[3]||"",kh:{ma:parts[4]||"",ten:parts[5]||"",dc:parts[6]||"",nn:parts[7]||"",sdt:parts[8]||"",xe:parts[9]||""},sp:prods,tong:Number(parts[11])||0};
  }
  var b64=qs.get("d")||"";
  if(!b64) throw new Error("no data");
  var s=b64.replace(/-/g,"+").replace(/_/g,"/"); while(s.length%4) s+="=";
  var o=JSON.parse(decodeURIComponent(escape(atob(s))));
  if(Array.isArray(o)) return {soPhieu:o[1]||"",soPhieuXuat:o[2]||"",soPO:o[3]||"",ngayGiao:o[4]||"",kh:{ma:(o[5]||[])[0]||"",ten:(o[5]||[])[1]||"",dc:(o[5]||[])[2]||"",nn:(o[5]||[])[3]||"",sdt:(o[5]||[])[4]||"",xe:(o[5]||[])[5]||""},sp:o[7]||[],tong:o[8]||0};
  return o;
}
try{
  var t=parseT();
  var kh=t.kh||{}; var sp=t.sp||[];
  var left='<div class="box left"><h2>THÔNG TIN PHIẾU</h2><div class="row"><b>Số phiếu</b><span>'+esc(t.soPhieu||"-")+'</span></div><div class="row"><b>Số phiếu xuất</b><span>'+esc(t.soPhieuXuat||"-")+'</span></div><div class="row"><b>Số PO</b><span>'+esc(t.soPO||"-")+'</span></div><div class="row"><b>Ngày giao</b><span>'+esc(fmtDMY(t.ngayGiao)||"-")+'</span></div></div>';
  var right='<div class="box right"><h2>THÔNG TIN KHÁCH HÀNG</h2><div class="cust">'+(kh.ten?'<div class="name">• '+esc(kh.ten)+'</div>':"")+(kh.dc?'<div>'+esc(kh.dc)+'</div>':"")+(kh.nn?'<div><span class="recv">• '+esc(kh.nn)+'</span>'+(kh.sdt?' • '+esc(kh.sdt):"")+'</div>':(kh.sdt?'<div>'+esc(kh.sdt)+'</div>':""))+(kh.xe?'<div>'+esc(kh.xe)+'</div>':"")+'</div></div>';
  var rows="", tongKg=0, totals={};
  sp.forEach(function(r,i){var p={maKho:r[0]||"",maFast:r[1]||"",tenSP:r[2]||"",quyCach:r[3]||"",ngaySX:r[4]||"",soGoi:r[5]||0,donVi:r[6]||"",soKg:r[7]||0}; var u=unitOf(p); totals[u]=(totals[u]||0)+(Number(p.soGoi)||0); var kg=calcKg(p); tongKg+=kg;
    rows+='<tr><td>'+(i+1)+'</td><td>'+esc(p.maFast)+'</td><td>'+(p.maKho?'<strong>'+esc(p.maKho)+'</strong><br>':"")+esc(p.tenSP)+'</td><td>'+esc(p.quyCach||"-")+'</td><td>'+esc(fmtDMY(p.ngaySX)||"-")+'</td><td class="num">'+fmt(p.soGoi)+' '+esc(u)+'</td><td class="num">'+fmt(kg)+' kg</td></tr>';});
  if(!rows) rows='<tr><td colspan="7">Không có sản phẩm</td></tr>';
  if(t.tong) tongKg=Number(t.tong)||tongKg;
  var totalQtyText=Object.keys(totals).map(function(k){return fmt(totals[k])+" "+k;}).join(" + ");
  document.getElementById("root").innerHTML='<div class="wrap"><h1>PHIẾU GIAO HÀNG</h1><div class="cols">'+left+right+'</div><table><thead><tr><th>STT</th><th>Mã Fast</th><th>Sản phẩm</th><th>Quy cách</th><th>NSX</th><th>Số lượng</th><th>Kg</th></tr></thead><tbody>'+rows+'</tbody></table><div class="total"><div>Tổng số lượng: '+totalQtyText+'</div><div>Tổng khối lượng: '+fmt(tongKg)+' kg</div></div></div>';
}catch(e){document.getElementById("root").innerHTML='<div style="text-align:center;padding:40px;color:#666">Vui lòng quét mã QR để xem phiếu</div>';}
</script></body></html>
