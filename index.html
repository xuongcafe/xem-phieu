<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff"><title>RUNAM - Xem phiếu giao hàng</title>
<style>
:root{--brown:#3c2415;--beige:#cbb397;--panel:#f7f5f2;--line:#d4d4d8;--ink:#171717;--paper:#fff}
*{box-sizing:border-box}body{margin:0;background:#f3f3f3;color:var(--ink);font-family:Arial,"Be Vietnam Pro",sans-serif}
.page{width:min(1120px,calc(100% - 24px));margin:22px auto;background:var(--paper);padding:34px 44px 42px;box-shadow:0 2px 16px #00000012;min-height:400px}
.brand{display:flex;justify-content:center;text-align:center;margin-bottom:8px}.brand-info{line-height:1.45}.company{font-weight:700;font-size:17px}.company-meta{font-size:12px;color:#555}
h1{text-align:center;color:var(--brown);font-size:28px;letter-spacing:.5px;margin:8px 0 18px;font-weight:800}
.rule{height:2px;background:#76675e;margin-bottom:18px}
.top{display:grid;grid-template-columns:36% 1fr;gap:16px;margin-bottom:16px}.panel{background:var(--panel);border-radius:10px;padding:14px}.panel h2{text-align:center;font-size:15px;letter-spacing:.5px;margin:0 0 10px;padding-bottom:8px;border-bottom:1px solid #86776e;color:#222}
.info-row{display:flex;justify-content:space-between;gap:14px;margin:8px 0;font-size:14px;font-weight:600}.info-row span:last-child{text-align:right;font-weight:700;overflow-wrap:anywhere}
.customer-body{font-size:14px;line-height:1.55;font-weight:600;white-space:pre-line}.customer-line{margin:3px 0;overflow-wrap:anywhere}
table{width:100%;border-collapse:collapse;table-layout:auto;font-size:13px}th{background:var(--beige);color:#23180f;text-align:left;font-weight:700}th,td{border:1px solid #c9c9ce;padding:8px 7px;vertical-align:middle}td{font-weight:500}.center{text-align:center}.right{text-align:right;white-space:nowrap}
.bottom{border-top:2px solid #5b463a;margin-top:15px;padding-top:10px;display:flex;justify-content:flex-end}.totals{text-align:right;font-size:14px;font-weight:700;line-height:1.55}.people{display:flex;justify-content:space-between;gap:20px;margin-top:28px;font-size:14px;font-weight:700}.person{min-width:40%;text-align:center}.status{max-width:800px;margin:40px auto;padding:20px;background:#fff;border:1px solid #ddd;border-radius:12px;color:#333;line-height:1.5}
@media(max-width:700px){.page{width:100%;margin:0;padding:22px 12px;min-height:100vh}.top{grid-template-columns:1fr}.panel{padding:12px}h1{font-size:22px}.info-row{font-size:13px}.customer-body{font-size:13px}table{font-size:11px}th,td{padding:6px 4px}.totals{font-size:13px}.people{font-size:13px}}
@media print{body{background:#fff}.page{width:100%;margin:0;padding:8mm;box-shadow:none;min-height:0}@page{size:A4;margin:5mm}}
</style></head>
<body><div id="app"><div class="status">Đang đọc dữ liệu phiếu...</div></div>
<script>
(()=>{const $=s=>document.querySelector(s),e=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),n=v=>{let x=Number(String(v??0).replace(',','.'));return Number.isFinite(x)?x:0},f=v=>Number(v||0).toLocaleString('vi-VN',{maximumFractionDigits:3}),d=v=>{let m=String(v||'').match(/^(\d{4})-(\d{2})-(\d{2})/);return m?m[3]+'/'+m[2]+'/'+m[1]:(v||'-')};
const lzw=v=>{let s=String(v||'');if(!s.startsWith('Z1'))return null;let b=s.slice(2).replace(/-/g,'+').replace(/_/g,'/');while(b.length%4)b+='=';let raw=atob(b),cs=[];for(let i=0;i+1<raw.length;i+=2)cs.push((raw.charCodeAt(i)<<8)|raw.charCodeAt(i+1));if(!cs.length)return '';let dict=[];for(let i=0;i<256;i++)dict[i]=String.fromCharCode(i);let next=256,old=dict[cs[0]],out=old;for(let i=1;i<cs.length;i++){let code=cs[i],v=dict[code];if(v===undefined&&code===next)v=old+old[0];if(v===undefined)throw Error('QR invalid');out+=v;if(next<65535)dict[next++]=old+v[0];old=v;}return decodeURIComponent(escape(out))},b64=s=>{s=String(s||'').replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return decodeURIComponent(escape(atob(s)))};
let q=new URLSearchParams(location.search),rows=[],total=0,showMaKho=true;if(q.has('d'))try{let o=JSON.parse(lzw(q.get('d'))??b64(q.get('d')));if(Array.isArray(o)&&(o[0]===2||o[0]===3)){rows=(o[1]||[]).map(r=>({maKho:r[0],maFast:r[1],tenSP:r[2],quyCach:r[3],ngaySX:r[4],soGoi:r[5],donVi:r[6],soKg:r[7]}));total=n(o[2]);if(o[0]===3)showMaKho=o[3]?.showMaKho!==false;}else if(Array.isArray(o)&&o[0]===1){rows=(o[7]||[]).map(r=>({maKho:r[0],maFast:r[1],tenSP:r[2],quyCach:r[3],ngaySX:r[4],soGoi:r[5],donVi:r[6],soKg:r[7]}));total=n(o[8]);}else if(o?.products){rows=o.products;total=n(o.totalKg);}}catch(x){}
if(!rows.length&&q.has('c'))rows=q.get('c').split(',').filter(Boolean).map(x=>{let a=x.split(':');return{maFast:a[0],soGoi:n(a[1]),ngaySX:a[2],donVi:'gói'}});
if(!rows.length&&q.has('t'))rows=q.get('t').split(',').filter(Boolean).map(x=>{let a=x.split('::');return{maFast:a[1],tenSP:a[2],quyCach:a[3],ngaySX:a[4],soGoi:n(a[5]),donVi:a[6]||'gói'}});
if(!rows.length&&q.has('data'))try{let o=JSON.parse(b64(q.get('data')));rows=o.products||[];total=n(o.totalKg)}catch(x){}
if(!rows.length){$('#app').innerHTML='<div class="status">Không đọc được dữ liệu sản phẩm. Vui lòng quét lại mã QR RUNAM.</div>';return;}
let kg=0,qtyByUnit={},body=rows.map((p,i)=>{kg+=n(p.soKg);let unit=String(p.donVi||'').trim();if(!unit){let qc=String(p.quyCach||'');unit=/[0-9]/.test(qc)?'gói':((qc.match(/[A-Za-zÀ-ỹ]+/g)||[]).pop()||'đơn vị');}qtyByUnit[unit]=(qtyByUnit[unit]||0)+n(p.soGoi);return '<tr><td>'+ (i+1)+'</td>'+(showMaKho?'<td>'+e(p.maKho)+'</td>':'')+'<td>'+e(p.maFast)+'</td><td>'+e(p.tenSP)+'</td><td>'+e(p.quyCach)+'</td><td>'+e(d(p.ngaySX))+'</td><td class="right">'+f(p.soGoi)+' '+e(unit)+'</td><td class="right">'+f(p.soKg)+' kg</td></tr>'}).join('');
$('#app').innerHTML='<main class="page"><h1>THÔNG TIN SẢN PHẨM</h1><div class="rule"></div><table><thead><tr><th>STT</th>'+(showMaKho?'<th>Mã kho</th>':'')+'<th>Mã Fast</th><th>Tên sản phẩm</th><th>Quy cách</th><th>Ngày sản xuất</th><th>Số lượng</th><th>Số kg</th></tr></thead><tbody>'+body+'</tbody></table><section class="bottom"><div class="totals">Tổng số lượng: '+Object.entries(qtyByUnit).map(([u,v])=>f(v)+' '+e(u)).join(' + ')+'<br>Tổng khối lượng: '+f(total||kg)+' kg</div></section></main>';document.title='THÔNG TIN SẢN PHẨM';})();
</script></body></html>
