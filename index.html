<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff"><title>RUNAM - Xem phiếu giao hàng</title>
<style>
:root{--brown:#3c2415;--beige:#cbb397;--panel:#f7f5f2;--line:#d4d4d8;--ink:#171717;--paper:#fff}
*{box-sizing:border-box}body{margin:0;background:#f3f3f3;color:var(--ink);font-family:Arial,"Be Vietnam Pro",sans-serif}
.page{width:min(1120px,calc(100% - 24px));margin:22px auto;background:var(--paper);padding:34px 44px 42px;box-shadow:0 2px 16px #00000012;min-height:400px}
.brand{display:flex;justify-content:center;text-align:center;margin-bottom:8px}.brand-info{line-height:1.45}.company{font-weight:700;font-size:17px}.company-meta{font-size:12px;color:#555}
h1{text-align:center;color:var(--brown);font-size:28px;letter-spacing:.5px;margin:8px 0 18px;font-weight:800}
.rule{height:2px;background:#76675e;margin-bottom:18px}
.top{display:grid;grid-template-columns:36% 1fr;gap:16px;margin-bottom:16px}.panel{background:var(--panel);border-radius:10px;padding:14px}.panel h2{text-align:center;font-size:15px;letter-spacing:.5px;margin:0 0 10px;padding-bottom:8px;border-bottom:1px solid #86776e;color:#222}
.info-row{display:flex;justify-content:space-between;gap:14px;margin:8px 0;font-size:14px;font-weight:600}.info-row span:last-child{text-align:right;font-weight:700;overflow-wrap:anywhere}
.customer-body{font-size:14px;line-height:1.55;font-weight:600;white-space:pre-line}.customer-line{margin:3px 0;overflow-wrap:anywhere}
table{width:100%;border-collapse:collapse;table-layout:auto;font-size:13px}th{background:var(--beige);color:#23180f;text-align:left;font-weight:700}th,td{border:1px solid #c9c9ce;padding:8px 7px;vertical-align:middle}td{font-weight:500}.center{text-align:center}.right{text-align:right;white-space:nowrap}
.bottom{border-top:2px solid #5b463a;margin-top:15px;padding-top:10px;display:flex;justify-content:flex-end}.totals{text-align:right;font-size:14px;font-weight:700;line-height:1.55}.people{display:flex;justify-content:space-between;gap:20px;margin-top:28px;font-size:14px;font-weight:700}.person{min-width:40%;text-align:center}.status{max-width:800px;margin:40px auto;padding:20px;background:#fff;border:1px solid #ddd;border-radius:12px;color:#333;line-height:1.5}
@media(max-width:700px){.page{width:100%;margin:0;padding:22px 12px;min-height:100vh}.top{grid-template-columns:1fr}.panel{padding:12px}h1{font-size:22px}.info-row{font-size:13px}.customer-body{font-size:13px}table{font-size:11px}th,td{padding:6px 4px}.totals{font-size:13px}.people{font-size:13px}}
@media print{body{background:#fff}.page{width:100%;margin:0;padding:8mm;box-shadow:none;min-height:0}@page{size:A4;margin:5mm}}
</style></head>
<body><div id="app"><div class="status">Đang đọc dữ liệu phiếu...</div></div>
<script>
(()=>{
 const $=s=>document.querySelector(s);
 const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const num=v=>{const n=Number(String(v??0).replace(',','.'));return Number.isFinite(n)?n:0};
 const fmt=v=>Number(v||0).toLocaleString('vi-VN',{maximumFractionDigits:3});
 const fmtDate=v=>{if(!v)return '-';const s=String(v);let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return `${m[3]}/${m[2]}/${m[1]}`;m=s.match(/^(\d{2})(\d{2})(\d{4})$/);if(m)return `${m[1]}/${m[2]}/${m[3]}`;return s};
 const params=new URLSearchParams(location.search);let ticket={},rows=[];
 const decode64=s=>{s=String(s||'').replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return decodeURIComponent(escape(atob(s)))};
 if(params.has('d')){try{const o=JSON.parse(decode64(params.get('d')));if(Array.isArray(o)&&o[0]===1){const kh=o[5]||[],co=o[6]||[];ticket={soPhieu:o[1]||'',soPhieuXuat:o[2]||'',soPO:o[3]||'',ngayGiao:o[4]||'',customer:{maKhach:kh[0]||'',tenDaiLy:kh[1]||'',diaChi:kh[2]||'',nguoiNhan:kh[3]||'',sdt:kh[4]||'',loaiXe:kh[5]||''},company:{tenXuong:co[0]||'',sdtXuong:co[1]||'',emailXuong:co[2]||'',diaChiXuong:co[3]||''},products:(o[7]||[]).map(r=>Array.isArray(r)?{maKho:r[0]||'',maFast:r[1]||'',tenSP:r[2]||'',quyCach:r[3]||'',ngaySX:r[4]||'',soGoi:r[5]||0,donVi:r[6]||'',soKg:r[7]||0}:r),totalKg:o[8]||0,nguoiGiao:o[9]||'',nguoiNhanHang:o[10]||'',displaySettings:o[11]||{}};rows=ticket.products;}}catch(e){}}
 // QR cu: giu kha nang doc cac dang du lieu cu
 if(!rows.length&&params.has('c')){rows=(params.get('c')||'').split(',').filter(Boolean).map(x=>{const a=x.split(':');return{maFast:a[0]||'',soGoi:num(a[1]),ngaySX:a[2]||'',tenSP:'',quyCach:'',donVi:'gói'};});}
 else if(!rows.length&&params.has('t')){rows=(params.get('t')||'').split(',').filter(Boolean).map(x=>{const a=x.split('::');return{maFast:a[1]||'',tenSP:a[2]||'',quyCach:a[3]||'',ngaySX:a[4]||'',soGoi:num(a[5]),donVi:a[6]||'gói'};});}
 else if(!rows.length&&params.has('data')){try{ticket=JSON.parse(decode64(params.get('data')));rows=Array.isArray(ticket.products)?ticket.products:[];}catch(e){}}
 if(!rows.length){$('#app').innerHTML='<div class="status"><b>Không đọc được dữ liệu sản phẩm.</b><br>Vui lòng quét lại mã QR trên phiếu RUNAM.</div>';return;}
 const ds=ticket.displaySettings||{},h=ds.h||{},l=ds.l||{},z=ds.z||{},th=ds.t||{};
 // Trong RUNAM, true = hien thi, false = an. QR cu chua co cau hinh se dung mac dinh hien thi.
 const show=k=>h[k]!==false;
 const label=(k,d)=>l[k]||d;
 const size=(k,d)=>{const n=Number(z[k]);return Number.isFinite(n)&&n>=8&&n<=32?n:d};
 const root=document.documentElement;
 if(/^#[0-9a-f]{6}$/i.test(th.main||''))root.style.setProperty('--brown',th.main);
 if(/^#[0-9a-f]{6}$/i.test(th.beige||''))root.style.setProperty('--beige',th.beige);
 if(/^#[0-9a-f]{6}$/i.test(th.boxBg||''))root.style.setProperty('--panel',th.boxBg);
 if(/^#[0-9a-f]{6}$/i.test(th.text||''))root.style.setProperty('--ink',th.text);
 if(['Inter','Arial','Roboto','Be Vietnam Pro','Playfair Display'].includes(th.font||''))document.body.style.fontFamily=`"${th.font}",Arial,sans-serif`;
 const c=ticket.customer||{},co=ticket.company||{};
 const companyMeta=[show('SDTIn')&&co.sdtXuong,show('EmailIn')&&co.emailXuong,show('DiaChiIn')&&co.diaChiXuong].filter(Boolean).join(' · ');
 const companyBlock=(show('TenXuongIn')&&co.tenXuong)||(companyMeta)?`<div class="brand"><div class="brand-info">${show('TenXuongIn')&&co.tenXuong?`<div class="company">${esc(co.tenXuong)}</div>`:''}${companyMeta?`<div class="company-meta">${esc(companyMeta)}</div>`:''}</div></div>`:'';
 const info=[['SoPhieuIn','soPhieu',label('soPhieu','Số phiếu'),ticket.soPhieu],['SoPhieuXuatIn','soPhieuXuat',label('soPhieuXuat','Số phiếu xuất'),ticket.soPhieuXuat],['SoPOIn','soPO',label('soPO','Số PO'),ticket.soPO],['NgayGiaoIn','ngayGiao',label('ngayGiao','Ngày giao'),fmtDate(ticket.ngayGiao)]];
 const infoRows=info.filter(x=>show(x[0])).map(x=>`<div class="info-row"><span>${esc(x[2])}</span><span>${esc(x[3]||'-')}</span></div>`).join('');
 const customerFields=[['MaKhachIn','maKhach',label('maKhach','Mã khách'),c.maKhach],['TenDaiLyIn','tenDaiLy',label('tenDaiLy','Tên đại lý'),c.tenDaiLy],['DiaChiKhachIn','diaChi',label('diaChi','Địa chỉ'),c.diaChi],['NguoiNhanIn','nguoiNhan',label('nguoiNhan','Người nhận'),c.nguoiNhan],['SDTNhanIn','sdtNhan',label('sdtNhan','SĐT người nhận'),c.sdt],['LoaiXeIn','loaiXe',label('loaiXe','Loại xe'),c.loaiXe]];
 const customerRows=customerFields.filter(x=>show(x[0])&&x[3]).map(x=>`<div class="customer-line">${esc(x[2])}: ${esc(x[3])}</div>`).join('');
 const columns=[['CotSTTIn','stt',label('stt','STT'),r=>String(r.i+1),'center'],['MaKhoIn','maKho',label('maKho','Mã kho'),r=>r.p.maKho||'',''],['MaFastIn','maFast',label('maFast','Mã Fast'),r=>r.p.maFast||'',''],['TenSPIn','tenSP',label('tenSP','Sản phẩm'),r=>r.p.tenSP||'',''],['QuyCachIn','quyCach',label('quyCach','Quy cách'),r=>r.p.quyCach||'-',''],['NgaySXIn','ngaySX',label('ngaySX','NSX'),r=>fmtDate(r.p.ngaySX),''],['SoGoiIn','soGoi',label('soGoi','Số lượng'),r=>`${fmt(num(r.p.soGoi))} ${r.p.donVi||(/\d/.test(String(r.p.quyCach||''))?'gói':(String(r.p.quyCach||'').trim().split(/\s+/).pop()||'đơn vị'))}`,'right'],['SoKgIn','soKg',label('soKg','Số kg'),r=>`${fmt(num(r.p.soKg))} kg`,'right']].filter(x=>show(x[0]));
 let totalQty=0,computedTotalKg=0;
 const productRows=rows.map((p,i)=>{const qty=num(p.soGoi);let kg=num(p.soKg);if(!kg){const m=String(p.quyCach||'').match(/([0-9]+(?:[.,][0-9]+)?)\s*(kg|g|gr)\b/i);if(m)kg=qty*num(m[1])/(m[2].toLowerCase()==='kg'?1:1000);}totalQty+=qty;computedTotalKg+=kg;return{p,i,kg};});
  const totalKg=Number.isFinite(Number(ticket.totalKg))&&ticket.totalKg!==''?num(ticket.totalKg):computedTotalKg;
 const header=columns.map(x=>`<th class="${x[4]}">${esc(x[2])}</th>`).join('');
 const body=productRows.map(r=>`<tr>${columns.map(x=>`<td class="${x[4]}">${esc(x[3]({p:r.p,i:r.i,kg:r.kg}))}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${Math.max(columns.length,1)}">Không có sản phẩm</td></tr>`;
 const totals=show('TongIn')?`<section class="bottom"><div class="totals">${esc(label('tongSoLuong','Tổng số lượng'))}: ${fmt(totalQty)}<br>${esc(label('tongKhoiLuong','Tổng khối lượng'))}: ${fmt(totalKg)} kg</div></section>`:'';
 const people=show('ChuKyIn')?`<section class="people">${show('NguoiGiaoKyIn')?`<div class="person">${esc(label('nguoiGiao','Người giao'))}</div>`:''}${show('NguoiNhanKyIn')?`<div class="person">${esc(label('nguoiNhanFooter','Người nhận'))}</div>`:''}</section>`:'';
 const title=label('mainTitle','PHIẾU GIAO HÀNG');
 const infoPanel=infoRows?`<div class="panel"><h2>${esc(label('thongTinPhieu','THÔNG TIN PHIẾU'))}</h2>${infoRows}</div>`:'';
 const customerPanel=customerRows?`<div class="panel"><h2>${esc(label('thongTinKhach','THÔNG TIN KHÁCH HÀNG'))}</h2><div class="customer-body">${customerRows}</div></div>`:'';
 const top=infoPanel||customerPanel?`<section class="top">${infoPanel}${customerPanel}</section>`:'';
 const productSection=columns.length?`<h2 style="font-size:${size('chiTietSP',15)}px;text-align:center;color:var(--brown)">${esc(label('chiTietSP','CHI TIẾT SẢN PHẨM'))}</h2><table><thead><tr>${header}</tr></thead><tbody>${body}</tbody></table>${totals}`:'';
  $('#app').innerHTML=`<main class="page">${companyBlock}<h1 style="font-size:${size('mainTitle',28)}px">${esc(title)}</h1><div class="rule"></div>${top}${productSection}${people}</main>`;
})();
</script></body></html>
