<!doctype html><html lang="vi"><head><meta charset="utf-8"><title>Phiếu giao hàng</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f3f4f6;font-family:Inter,Arial,sans-serif;color:#1f2937}.wrap{width:700px;max-width:100%;margin:0 auto;background:#fff;padding:16px}h1{font-size:20px;text-align:center;margin:0 0 12px;color:#3C2415;border-bottom:2px solid #3C2415;padding-bottom:10px}.cols{display:flex;gap:12px;margin-bottom:12px}.box{border:1px solid #e5e7eb;border-radius:8px;padding:12px;flex:1}.box h2{font-size:11px;margin:0 0 8px;border-bottom:1px solid #3C2415;padding-bottom:6px}.row{display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-bottom:1px solid #f3f4f6;font-size:12px}.cust div{margin-bottom:2px;font-size:12px}.cust .name{font-weight:700;font-size:13px;color:#3C2415}table{width:100%;border-collapse:collapse;font-size:12px}th,td{border:1px solid #d1d5db;padding:8px;text-align:left}th{background:#3C2415;color:#fff}.num{text-align:right;white-space:nowrap}.total{text-align:right;font-weight:700;margin-top:10px;font-size:13px;border-top:2px solid #3C2415;padding-top:8px}.sign{display:flex;justify-content:space-between;margin-top:20px;font-size:12px;text-align:center}.sign div{flex:1}</style>
</head><body><div id="root" style="text-align:center;padding:40px;color:#666">Vui lòng quét mã QR để xem phiếu</div>
<script>
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function fmt(n){n=Number(n)||0;return (Math.round(n*100)/100).toString();}
function fmtDMY(v){var s=String(v||"").trim();var m=s.match(/^(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})/);if(m) return String(m[3]).padStart(2,"0")+"/"+String(m[2]).padStart(2,"0")+"/"+m[1];return s;}
function calcKg(p){var q=String(p.quyCach||"").toLowerCase();var m=q.match(/([0-9]+(?:\.[0-9]+)?)/);var u=m?Number(m[1]):0;if(!u) return Number(p.soKg)||0;if(q.indexOf("kg")>=0) return (Number(p.soGoi)||0)*u;if(q.indexOf("gr")>=0||q.indexOf("g")>=0) return (Number(p.soGoi)||0)*u/1000;return (Number(p.soGoi)||0)*u;}
function unitOf(p){var u=String(p.donVi||"").trim();if(u) return u;var qc=String(p.quyCach||"");return /[0-9]/.test(qc)?"gói":"đơn vị";}
try{
  var qs=new URLSearchParams(location.search);var tt=qs.get("t");if(!tt) throw new Error("no");
  var parts=tt.split("|");var prods=[];if(parts[10]){prods=parts[10].split(",").filter(Boolean).map(function(x){var f=x.split("::");return [f[0]||"",f[1]||"",f[2]||"",f[3]||"",f[4]||"",Number(f[5])||0,f[6]||"",0];});}
  var t={soPhieu:parts[0]||"",soPhieuXuat:parts[1]||"",soPO:parts[2]||"",ngayGiao:parts[3]||"",kh:{ma:parts[4]||"",ten:parts[5]||"",dc:parts[6]||"",nn:parts[7]||"",sdt:parts[8]||"",xe:parts[9]||""},sp:prods};
  var rows="",tongKg=0,totals={};t.sp.forEach(function(r,i){var p={maKho:r[0]||"",maFast:r[1]||"",tenSP:r[2]||"",quyCach:r[3]||"",ngaySX:r[4]||"",soGoi:r[5]||0,donVi:r[6]||"",soKg:r[7]||0};var u=unitOf(p);totals[u]=(totals[u]||0)+(Number(p.soGoi)||0);var kg=calcKg(p);tongKg+=kg;rows+='<tr><td>'+(i+1)+'</td><td>'+esc(p.maFast)+'</td><td>'+esc(p.tenSP)+'</td><td>'+esc(p.quyCach||"-")+'</td><td>'+esc(fmtDMY(p.ngaySX)||"-")+'</td><td class="num">'+fmt(p.soGoi)+' '+esc(u)+'</td><td class="num">'+fmt(kg)+' kg</td></tr>';});
  var totalQty=Object.keys(totals).map(function(k){return fmt(totals[k])+" "+k;}).join(" + ");
  var html='<div class="wrap"><h1>PHIẾU GIAO HÀNG</h1><div class="cols"><div class="box"><h2>THÔNG TIN PHIẾU</h2><div class="row"><b>Số phiếu</b><span>'+esc(t.soPhieu||"-")+'</span></div><div class="row"><b>Ngày giao</b><span>'+esc(fmtDMY(t.ngayGiao)||"-")+'</span></div></div><div class="box"><h2>THÔNG TIN KHÁCH HÀNG</h2><div class="cust"><div class="name">'+esc(t.kh.ten||"")+'</div><div>'+esc(t.kh.dc||"")+'</div><div>'+esc(t.kh.nn||"")+'</div><div>'+esc(t.kh.sdt||"")+'</div></div></div></div><table><thead><tr><th>STT</th><th>Mã Fast</th><th>Sản phẩm</th><th>Quy cách</th><th>NSX</th><th>Số lượng</th><th>Số kg</th></tr></thead><tbody>'+rows+'</tbody></table><div class="total">Tổng số lượng: '+totalQty+'<br>Tổng khối lượng: '+fmt(tongKg)+' kg</div><div class="sign"><div>Người giao<br><br>________________</div><div>Người nhận<br><br>________________</div></div></div>';
  document.getElementById("root").innerHTML=html;
}catch(e){document.getElementById("root").innerHTML='<div style="text-align:center;padding:40px;color:#666">Vui lòng quét mã QR để xem phiếu</div>';}
</script></body></html>
