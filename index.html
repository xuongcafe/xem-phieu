<!doctype html><html lang="vi"><head><title>Phieu giao hang</title>
<style>@page{size:210mm 297mm;margin:5mm}*{box-sizing:border-box}html,body{margin:0;padding:0;background:#fff;color:#1f2937;font-family:Inter,Arial,sans-serif}.wrap{width:700px;max-width:100%;margin:0 auto;padding:16px;font-size:13px;line-height:1.4}h1{font-size:18px;text-align:center;margin:0 0 12px;color:#3C2415;border-bottom:1px solid #E7DCC0;padding-bottom:10px;letter-spacing:.08em}.cols{display:flex;gap:12px;margin-bottom:12px}.box{border:1px solid #e5e7eb;border-radius:8px;padding:12px;background:#fff}.box.left{width:35%}.box.right{width:65%}.box h2{font-size:11px;margin:0 0 8px;color:#1f2937;letter-spacing:.1em;border-bottom:1px solid #E7DCC0;padding-bottom:6px}.row{display:flex;justify-content:space-between;gap:8px;padding-bottom:4px;border-bottom:1px solid rgba(243,232,208,.6);margin-bottom:4px;font-size:12px}.row b{font-weight:700}.row span{text-align:right}.cust{font-size:12px;text-align:left}.cust .name{font-size:13px;font-weight:700;color:#3C2415}.cust .code{display:inline-block;padding:2px 8px;border-radius:999px;background:#3C2415;color:#fff;font-size:11px;font-weight:700;margin-bottom:4px}.cust .recv{font-weight:700}.cust div{margin-bottom:2px}table{width:100%;border-collapse:collapse;margin-top:6px;font-size:12px}th,td{border:1px solid #d1d5db;padding:8px;vertical-align:top;text-align:left}th{background:#3C2415;color:#fff;font-weight:700;font-size:11px}.num{text-align:right;white-space:nowrap}.total{text-align:right;font-weight:700;margin-top:10px;font-size:13px;border-top:2px solid #3C2415;padding-top:8px}.total div{margin-bottom:2px}@media(max-width:560px){.cols{flex-direction:column}.box.left,.box.right{width:100%}}</style>
</head><body><div id="root" style="text-align:center;padding:40px;color:#666">Dang tai phieu...</div>
<script>
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function fmt(n){n=Number(n)||0;return (Math.round(n*100)/100).toString();}
function calcKg(p){var m=String(p.quyCach||"").match(/([0-9]+(?:\.[0-9]+)?)/);var u=m?Number(m[1]):0;return u>0?(Number(p.soGoi)||0)*u:(Number(p.soKg)||0);}
try{
  var b64=new URLSearchParams(location.search).get("d")||"";
  if(!b64) throw new Error("no data");
  var s=b64.replace(/-/g,"+").replace(/_/g,"/"); while(s.length%4) s+="=";
  var json=decodeURIComponent(escape(atob(s)));
  var o=JSON.parse(json);
  var t;
  if(Array.isArray(o)){ t={soPhieu:o[1]||"",soPhieuXuat:o[2]||"",soPO:o[3]||"",ngayGiao:o[4]||"",kh:{ma:(o[5]||[])[0]||"",ten:(o[5]||[])[1]||"",dc:(o[5]||[])[2]||"",nn:(o[5]||[])[3]||"",sdt:(o[5]||[])[4]||"",xe:(o[5]||[])[5]||""},sp:o[7]||[],tong:o[8]||0}; }
  else { t=o; }
  var kh=t.kh||{}; var sp=t.sp||[];
  var left='<div class="box left"><h2>THONG TIN PHIEU</h2><div class="row"><b>So phieu</b><span>'+esc(t.soPhieu||"-")+'</span></div><div class="row"><b>So phieu xuat</b><span>'+esc(t.soPhieuXuat||"-")+'</span></div><div class="row"><b>So PO</b><span>'+esc(t.soPO||"-")+'</span></div><div class="row"><b>Ngay giao</b><span>'+esc(t.ngayGiao||"-")+'</span></div></div>';
  var right='<div class="box right"><h2>THONG TIN KHACH HANG</h2><div class="cust">'+(kh.ma?'<span class="code">'+esc(kh.ma)+'</span><br>':"")+(kh.ten?'<div class="name">• '+esc(kh.ten)+'</div>':"")+(kh.dc?'<div>'+esc(kh.dc)+'</div>':"")+(kh.nn?'<div><span class="recv">• '+esc(kh.nn)+'</span>'+(kh.sdt?' • '+esc(kh.sdt):"")+'</div>':(kh.sdt?'<div>'+esc(kh.sdt)+'</div>':""))+(kh.xe?'<div>'+esc(kh.xe)+'</div>':"")+'</div></div>';
  var rows="", tongKg=0, tongSL=0;
  sp.forEach(function(r,i){var p={maKho:r[0]||"",maFast:r[1]||"",tenSP:r[2]||"",quyCach:r[3]||"",ngaySX:r[4]||"",soGoi:r[5]||0,donVi:r[6]||"",soKg:r[7]||0}; var kg=calcKg(p); tongKg+=kg; tongSL+=Number(p.soGoi)||0;
    rows+='<tr><td>'+(i+1)+'</td><td>'+esc(p.maFast)+'</td><td>'+(p.maKho?'<strong>'+esc(p.maKho)+'</strong><br>':"")+esc(p.tenSP)+'</td><td>'+esc(p.quyCach||"-")+'</td><td>'+esc(p.ngaySX||"-")+'</td><td class="num">'+fmt(p.soGoi)+' '+esc(p.donVi)+'</td><td class="num">'+fmt(kg)+' kg</td></tr>';});
  if(!rows) rows='<tr><td colspan="7">Khong co san pham</td></tr>';
  if(t.tong) tongKg=Number(t.tong)||tongKg;
  document.getElementById("root").innerHTML='<div class="wrap"><h1>PHIEU GIAO HANG</h1><div class="cols">'+left+right+'</div><table><thead><tr><th>STT</th><th>Ma Fast</th><th>San pham</th><th>Quy cach</th><th>NSX</th><th>So luong</th><th>Kg</th></tr></thead><tbody>'+rows+'</tbody></table><div class="total"><div>Tong so luong: '+fmt(tongSL)+'</div><div>Tong khoi luong: '+fmt(tongKg)+' kg</div></div></div>';
}catch(e){document.getElementById("root").innerHTML='<div style="text-align:center;padding:40px;color:#991b1b">Khong doc duoc ma QR. Hay quet lai phieu goc.</div>';}
</script></body></html>
