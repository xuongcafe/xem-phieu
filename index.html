<!doctype html><html lang="vi"><head><meta charset="utf-8"><title>Phiếu giao hàng</title>
<style>@page{size:210mm 297mm;margin:5mm}*{box-sizing:border-box}html,body{margin:0;padding:0;background:#fff;color:#1f2937;font-family:Inter,Arial,sans-serif}.wrap{width:700px;max-width:100%;margin:0 auto;padding:16px;font-size:13px;line-height:1.4}h1{font-size:18px;text-align:center;margin:0 0 12px;color:#3C2415;border-bottom:1px solid #3C2415;padding-bottom:10px;letter-spacing:.02em}.cols{display:flex;gap:12px;margin-bottom:12px}.box{border:1px solid #e5e7eb;border-radius:8px;padding:12px;background:#fff}.box.left{width:35%}.box.right{width:65%}.box h2{font-size:11px;margin:0 0 8px;color:#1f2937;letter-spacing:.05em;border-bottom:1px solid #3C2415;padding-bottom:6px}.row{display:flex;justify-content:space-between;gap:8px;padding-bottom:4px;border-bottom:1px solid rgba(243,232,208,.6);margin-bottom:4px;font-size:12px}.row b{font-weight:700}.row span{text-align:right}.cust{font-size:12px;text-align:left}.cust .name{font-size:13px;font-weight:700;color:#3C2415}.cust .recv{font-weight:700}.cust div{margin-bottom:2px}table{width:100%;border-collapse:collapse;margin-top:6px;font-size:12px}th,td{border:1px solid #d1d5db;padding:8px;vertical-align:top;text-align:left}th{background:#3C2415;color:#fff;font-weight:700;font-size:11px}.num{text-align:right;white-space:nowrap}.total{text-align:right;font-weight:700;margin-top:10px;font-size:13px;border-top:2px solid #3C2415;padding-top:8px}.total div{margin-bottom:2px}@media(max-width:560px){.cols{flex-direction:column}.box.left,.box.right{width:100%}}</style>
</head><body><div id="root" style="text-align:center;padding:40px;color:#666">Vui lòng quét mã QR để xem phiếu</div>
<script>
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function fmt(n){n=Number(n)||0;return (Math.round(n*100)/100).toString();}
function fmtDMY(v){var s=String(v||"").trim();var m=s.match(/^(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})/);if(m) return String(m[3]).padStart(2,"0")+"/"+String(m[2]).padStart(2,"0")+"/"+m[1];return s;}
function parseSettings(){try{var qs=new URLSearchParams(location.search);var b64=qs.get("s")||"";if(!b64) return {};var s=b64.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4) s+="=";return JSON.parse(decodeURIComponent(escape(atob(s))))||{};}catch(e){return {};}}
function parseC(){var qs=new URLSearchParams(location.search);var b64=qs.get("c")||"";if(!b64) return null;var s=b64.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4) s+="=";var o=JSON.parse(decodeURIComponent(escape(atob(s))));var sp=(o[5]||[]).map(function(r){var d=String(r[3]||"");var ngaySX=d;if(/^\d{6}$/.test(d)) ngaySX=d.slice(0,2)+"/"+d.slice(2,4)+"/20"+d.slice(4,6);var qc=r[2]?String(r[2])+"gr":"-";var kg=0;var q=parseFloat(r[2])||0;if(q) kg=(Number(r[1])||0)*q/1000;return [r[0]||"",r[0]||"",r[4]||"",qc,ngaySX,Number(r[1])||0,"gói",kg];});return {soPhieu:o[0]||"",ngayGiao:o[1]||"",kh:{ten:o[2]||"",nn:o[3]||"",sdt:o[4]||""},sp:sp};}
function parseT(){var qs=new URLSearchParams(location.search);var tt=qs.get("t");if(tt){var parts=tt.split("|");var prods=[];if(parts[10]){prods=parts[10].split(",").filter(Boolean).map(function(x){var f=x.split("::");return [f[0]||"",f[1]||"",f[2]||"",f[3]||"",f[4]||"",Number(f[5])||0,f[6]||"",0];});}return {soPhieu:parts[0]||"",ngayGiao:parts[3]||"",kh:{ten:parts[5]||"",nn:parts[7]||"",sdt:parts[8]||""},sp:prods};}return null;}
try{
  var S=parseSettings();var main=S.m?"#"+S.m:"#3C2415";var boxBg=S.b?"#"+S.b:"#FFFFFF";var L=S.l||{};
  var hideKeys=["LogoIn","TenXuongIn","SDTIn","EmailIn","DiaChiIn","SoPhieuIn","SoPhieuXuatIn","SoPOIn","NgayGiaoIn","QRIn","MaKhachIn","TenDaiLyIn","DiaChiKhachIn","NguoiNhanIn","SDTNhanIn","LoaiXeIn","CotSTTIn","MaKhoIn","MaFastIn","TenSPIn","QuyCachIn","NgaySXIn","SoGoiIn","SoKgIn","TongIn","ChuKyIn","NguoiGiaoKyIn","NguoiNhanKyIn"];
  var hideMap={};if(S.h){hideKeys.forEach(function(k,i){hideMap[k]=S.h[i]!=="0";});}
  var isHidden=function(k){return hideMap[k]===false;};var lab=function(k,fb){return L[k]||fb;};
  var style=document.createElement("style");style.textContent="h1{color:"+main+"!important;border-bottom-color:"+main+"!important}.box{background:"+boxBg+"!important}.box h2{border-bottom-color:"+main+"!important}.cust .name{color:"+main+"!important}th{background:"+main+"!important}.total{border-top-color:"+main+"!important}";document.head.appendChild(style);
  var t=parseC()||parseT();if(!t) throw new Error("no data");var kh=t.kh||{};var sp=t.sp||[];
  var leftRows="";if(!isHidden("SoPhieuIn")) leftRows+='<div class="row"><b>'+esc(lab("soPhieu","Số phiếu"))+'</b><span>'+esc(t.soPhieu||"-")+'</span></div>';if(!isHidden("NgayGiaoIn")) leftRows+='<div class="row"><b>'+esc(lab("ngayGiao","Ngày giao"))+'</b><span>'+esc(fmtDMY(t.ngayGiao)||"-")+'</span></div>';
  var left='<div class="box left"><h2>'+esc(lab("thongTinPhieu","THÔNG TIN PHIẾU"))+'</h2>'+leftRows+'</div>';
  var custHtml="";if(!isHidden("TenDaiLyIn")&&kh.ten) custHtml+='<div class="name">• '+esc(kh.ten)+'</div>';if(!isHidden("NguoiNhanIn")&&kh.nn) custHtml+='<div><span class="recv">• '+esc(kh.nn)+'</span></div>';if(!isHidden("SDTNhanIn")&&kh.sdt) custHtml+='<div>'+esc(kh.sdt)+'</div>';
  var right='<div class="box right"><h2>'+esc(lab("thongTinKhach","THÔNG TIN KHÁCH HÀNG"))+'</h2><div class="cust">'+custHtml+'</div></div>';
  var rows="",tongKg=0,totals={};sp.forEach(function(r,i){var p={maKho:r[0]||"",maFast:r[1]||"",tenSP:r[2]||"",quyCach:r[3]||"",ngaySX:r[4]||"",soGoi:r[5]||0,donVi:r[6]||""};var u="gói";totals[u]=(totals[u]||0)+(Number(p.soGoi)||0);var qc=String(p.quyCach||"");var m=qc.match(/([0-9]+(?:\.[0-9]+)?)/);var kg=m?(Number(p.soGoi)||0)*Number(m[1])/1000:0;tongKg+=kg;rows+='<tr>'+(!isHidden("CotSTTIn")?'<td>'+(i+1)+'</td>':"")+(!isHidden("MaFastIn")?'<td>'+esc(p.maFast)+'</td>':"")+(!isHidden("MaKhoIn")?'<td>'+esc(p.maKho)+'</td>':"")+(!isHidden("TenSPIn")?'<td>'+esc(p.tenSP)+'</td>':"")+(!isHidden("QuyCachIn")?'<td>'+esc(p.quyCach||"-")+'</td>':"")+(!isHidden("NgaySXIn")?'<td>'+esc(fmtDMY(p.ngaySX)||"-")+'</td>':"")+(!isHidden("SoGoiIn")?'<td class="num">'+fmt(p.soGoi)+' '+esc(u)+'</td>':"")+(!isHidden("SoKgIn")?'<td class="num">'+fmt(kg)+' kg</td>':"")+'</tr>';});
  if(!rows) rows='<tr><td colspan="7">Không có sản phẩm</td></tr>';
  var totalQtyText=Object.keys(totals).map(function(k){return fmt(totals[k])+" "+k;}).join(" + ");
  var totalHtml="";if(!isHidden("TongIn")) totalHtml='<div class="total"><div>'+esc(lab("tongSoLuong","Tổng số lượng"))+': '+totalQtyText+'</div><div>'+esc(lab("tongKhoiLuong","Tổng khối lượng"))+': '+fmt(tongKg)+' kg</div></div>';
  var headRow='<tr>'+(!isHidden("CotSTTIn")?'<th>STT</th>':"")+(!isHidden("MaFastIn")?'<th>'+esc(lab("maFast","Mã Fast"))+'</th>':"")+(!isHidden("MaKhoIn")?'<th>'+esc(lab("maKho","Mã kho"))+'</th>':"")+(!isHidden("TenSPIn")?'<th>'+esc(lab("tenSP","Sản phẩm"))+'</th>':"")+(!isHidden("QuyCachIn")?'<th>'+esc(lab("quyCach","Quy cách"))+'</th>':"")+(!isHidden("NgaySXIn")?'<th>'+esc(lab("ngaySX","NSX"))+'</th>':"")+(!isHidden("SoGoiIn")?'<th>'+esc(lab("soGoi","Số lượng"))+'</th>':"")+(!isHidden("SoKgIn")?'<th>'+esc(lab("soKg","Số kg"))+'</th>':"")+'</tr>';
  var signHtml="";if(!isHidden("ChuKyIn")&&(!isHidden("NguoiGiaoKyIn")||!isHidden("NguoiNhanKyIn"))){signHtml='<div style="display:flex;justify-content:space-between;margin-top:12px;font-weight:700;font-size:13px;padding:0 8mm">'+(!isHidden("NguoiGiaoKyIn")?'<div>'+esc(lab("nguoiGiao","Người giao hàng"))+'</div>':"<div></div>")+(!isHidden("NguoiNhanKyIn")?'<div>'+esc(lab("nguoiNhanFooter","Người nhận hàng"))+'</div>':"<div></div>")+'</div>';}
  document.getElementById("root").innerHTML='<div class="wrap"><h1>'+esc(lab("mainTitle","PHIẾU GIAO HÀNG"))+'</h1><div class="cols">'+left+right+'</div><div style="font-size:11px;letter-spacing:.1em;font-weight:700;text-align:center;margin:8px 0 4px;color:'+main+'">'+esc(lab("chiTietSP","CHI TIẾT SẢN PHẨM"))+'</div><table><thead>'+headRow+'</thead><tbody>'+rows+'</tbody></table>'+totalHtml+signHtml+'</div>';
}catch(e){document.getElementById("root").innerHTML='<div style="text-align:center;padding:40px;color:#666">Vui lòng quét mã QR để xem phiếu</div>';}
</script></body></html>
